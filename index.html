<!doctype html>
<!--
  Tela principal da live: o JOGO 3D da Vila do Noel, ligado ao servidor (papel 'game'), com os mesmos comandos do
  painel. O código fica em src/jogo3d/main.ts (os parâmetros do endereço estão no cabeçalho dele).
    /                   tela do jogo num navegador comum (precisa de um clique para liberar o som)
    /?obs               só o que vai para a live (fonte de navegador do OBS: sem avisos nem botões)
    /?obs&janela=1      para captura de janela (TikTok LIVE Studio): janela em 9:16, sem avisos na imagem
  A versão clássica (2D) continua em /classico.html. O jogo3d.html é a mesma página (endereço antigo, mantido para
  o laboratório e as ferramentas de foto e vídeo): mantenha os dois arquivos iguais.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vila do Noel Live</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1626;
        overflow: hidden;
      }
      #carregando {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #e8bc65;
        font: 600 20px 'Fredoka', 'Segoe UI', system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="palco"></div>
    <div id="carregando">Carregando a Vila do Noel…</div>
    <div id="som" role="button" tabindex="0" hidden>🔈 Clique na tela para ligar o som</div>
    <div id="demo" class="j3d-barra" role="group" aria-label="Controles da demonstração" hidden>
      <button class="botao principal" type="button" data-acao="um">🌹 Entrar 1</button>
      <button class="botao" type="button" data-acao="dez">Entrar 10</button>
      <button class="botao" type="button" data-acao="TREE_SPARKLE">🎄 Árvore brilhando</button>
      <button class="botao" type="button" data-acao="FIREPLACE_MAGIC">🔥 Lareira mágica</button>
      <button class="botao" type="button" data-acao="SLEIGH_PASS">🛷 Trenó</button>
      <button class="botao" type="button" data-acao="MAGICAL_NIGHT">✨ Noite mágica</button>
      <button class="botao discreto" type="button" data-acao="som" aria-pressed="false"><span class="icone" aria-hidden="true">🔇</span><span class="rotulo">Som</span></button>
    </div>
    <script type="module" src="/src/jogo3d/main.ts"></script>
  </body>
</html>
